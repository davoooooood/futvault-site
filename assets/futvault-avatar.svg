<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="FUTVault Official Bot Avatar (640x640)">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#112E32"/>
      <stop offset="52%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shieldCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112A34"/>
      <stop offset="100%" stop-color="#070D19"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian & Emerald Radial Canvas -->
  <rect width="640" height="640" fill="url(#bgGlow)"/>

  <!-- Circular Medallion Safe-Zone Ring for Telegram Avatar Crop -->
  <circle cx="320" cy="320" r="296" fill="none" stroke="url(#emeraldGlow)" stroke-width="4" stroke-opacity="0.65"/>
  <circle cx="320" cy="320" r="282" fill="none" stroke="url(#goldBevel)" stroke-width="2.5" stroke-dasharray="12 8" stroke-opacity="0.8"/>

  <!-- Top Security Header Pill -->
  <rect x="172" y="48" width="296" height="34" rx="17" fill="#0B1728" stroke="url(#goldBevel)" stroke-width="1.8"/>
  <text x="320" y="70" text-anchor="middle" fill="#FDE68A" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" letter-spacing="2">SOVEREIGN ESCROW VAULT</text>

  <!-- Side Capability Pills Inside Circular Safe Zone -->
  <rect x="52" y="252" width="108" height="32" rx="16" fill="#0C2233" stroke="#38BDF8" stroke-width="1.6"/>
  <text x="106" y="273" text-anchor="middle" fill="#7DD3FC" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800">OPEN BID</text>

  <rect x="480" y="252" width="108" height="32" rx="16" fill="#231B0A" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="534" y="273" text-anchor="middle" fill="#FDE68A" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800">P2P ESCROW</text>

  <!-- Hexagonal Vault Shield Crest -->
  <polygon points="320,98 466,182 466,350 320,434 174,350 174,182" fill="url(#goldBevel)"/>
  <polygon points="320,111 454,189 454,343 320,421 186,343 186,189" fill="#070C16" stroke="url(#emeraldGlow)" stroke-width="4"/>
  <polygon points="320,126 441,196 441,336 320,406 199,336 199,196" fill="url(#shieldCore)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- 3 Championship Stars -->
  <circle cx="288" cy="166" r="5.5" fill="#FBBF24"/>
  <circle cx="320" cy="156" r="7.5" fill="#FEF08A"/>
  <circle cx="352" cy="166" r="5.5" fill="#FBBF24"/>

  <!-- Central FV Monogram -->
  <path d="M234 202 H310 V227 H263 V254 H302 V278 H263 V326 H234 Z" fill="#F8FAFC"/>
  <path d="M318 202 H348 L370 286 L392 202 H422 L385 326 H356 Z" fill="url(#goldBevel)"/>
  <text x="320" y="354" text-anchor="middle" fill="#7DD3FC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="800" letter-spacing="1.6">BUY • SELL • P2P</text>
  <path d="M274 366 L320 388 L366 366" fill="none" stroke="url(#emeraldGlow)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand Wordmark -->
  <text x="320" y="482" text-anchor="middle" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="4">FUTVAULT</text>

  <!-- Primary Anti-Ban & Zero-KYC Trust Badge -->
  <rect x="134" y="498" width="372" height="40" rx="20" fill="#0B2624" stroke="url(#emeraldGlow)" stroke-width="2.4"/>
  <text x="320" y="524" text-anchor="middle" fill="#6EE7B7" font-family="JetBrains Mono, Plus Jakarta Sans, monospace" font-size="16" font-weight="800" letter-spacing="1.4">100% ANTI-BAN • ZERO-KYC</text>

  <!-- Bottom Multi-Rail Pill Inside Safe Zone -->
  <rect x="192" y="546" width="256" height="28" rx="14" fill="#091322" stroke="#38BDF8" stroke-width="1.3" stroke-opacity="0.7"/>
  <text x="320" y="565" text-anchor="middle" fill="#BAE6FD" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" letter-spacing="1.2">USDT TRC20 • BEP20 • TON</text>
</svg>